<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Login | QAFlow</title>

    <link rel="icon" href="../assets/img/favicon.ico" />

    <link
      href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../css/style.css" />
  </head>

  <body>
    <header class="header">
      <h1 class="logo">QA<span>Flow</span></h1>

      <nav class="menu">
        <a href="#">Recursos</a>
        <a href="#">Soluções</a>
        <a href="#">Planos</a>
        <a href="#">Sobre</a>
        <a href="#">Contato</a>
      </nav>
    </header>

    <main class="main">
      <div class="container">
        <form>
          <h1>Login QAFlow</h1>

          <div class="input-box">
            <input type="email" name="email" placeholder="Usuário" required />

            <i class="bx bxs-user"></i>
          </div>

          <div class="input-box">
            <input
              type="password"
              name="password"
              placeholder="Senha"
              required
            />

            <i class="bx bxs-lock-alt"></i>
          </div>

          <div class="remember">
            <label>
              <input type="checkbox" />
              Lembrar minha sessão
            </label>

            <a href="#">Esqueci minha senha</a>
          </div>

          <button class="login" type="submit">Entrar</button>

          <div class="register-link">
            <p>
              Não possui uma conta?
              <a href="#">Cadastre-se</a>
            </p>
          </div>
        </form>
      </div>
    </main>

    <footer class="footer">
      <h2 class="logo">QA<span>Flow</span></h2>

      <p>© 2026 QAFlow. Todos os direitos reservados.</p>
    </footer>
  </body>
</html>
